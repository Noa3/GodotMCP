name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CLI works
        run: node dist/cli/index.js --help

      - name: Verify doctor --help
        run: node dist/cli/index.js doctor --help

      - name: Verify addon files
        shell: bash
        run: |
          test -f addons/godot_universal_mcp/plugin.cfg
          test -f addons/godot_universal_mcp/plugin.gd
          test -f addons/godot_universal_mcp/editor_bridge.gd
          test -f addons/godot_universal_mcp/runtime_bridge.gd
          echo "Addon files verified"

  verify-package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check package files
        run: |
          node -e "const p = require('./package.json'); console.log('Package:', p.name, p.version)"
          test -d dist
          test -f dist/cli/index.js
          echo "Package verification passed"
