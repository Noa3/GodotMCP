name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Tool catalog cannot drift from the manifest
        run: node scripts/generate-tool-reference.cjs --check
      - run: node dist/cli/index.js --help
      - run: node dist/cli/index.js doctor --help
  verify-package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect npm package contents
        run: |
          npm pack --dry-run --json > /tmp/package.json
          node -e "const p=require('/tmp/package.json')[0]; for (const f of ['dist/cli/index.js','addons/godot_universal_mcp/tool_manifest.json','addons/godot_universal_mcp/tool_catalog.gd']) { if (!p.files.some(x=>x.path===f)) throw new Error('Missing package file '+f); }"
