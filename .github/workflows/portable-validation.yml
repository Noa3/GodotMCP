name: Portable workflows
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact reviewed source (no credentials or working files)
        run: git archive --format=tar HEAD -o "${{ runner.temp }}/godotmcp-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: ${{ runner.temp }}/godotmcp-source.tar
          retention-days: 2
